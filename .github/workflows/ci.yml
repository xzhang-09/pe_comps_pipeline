name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Locked versions first (reproducible builds — see requirements.lock),
      # then the package itself without re-resolving its loose ranges.
      - name: Install dependencies
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Run tests
        run: pytest tests/ -v --cov --cov-fail-under=70
