target_company:
  name: "Example Manufacturing Co."
  description: >
    Mid-market industrial parts manufacturer serving automotive OEMs
    in North America. Primarily B2B with long-term supply contracts.
    Approximately 70% of revenue is recurring. Asset-heavy operations
    with significant manufacturing facilities.
  gics_sector: "20"
  gics_industry: "2010"
  revenue_usd_mm: 150
  ebitda_margin_estimate: 0.18
  geography: "north_america"
  # Most directly relevant to "automotive OEM parts manufacturer": motor
  # vehicle parts plus general industrial machinery/fabricated metal.
  primary_sic_codes: ["3714", "3559", "3569", "3490"]
  # Broader industrial machinery/equipment/building-products SIC codes —
  # not central to the target's actual business, but close enough to add
  # real training-data volume without any hardcoded ticker list. Explicitly
  # excludes aerospace/defense SIC codes (3760/3721/3724/3812/etc).
  adjacent_sic_codes: [
    "3612", "3613", "3621", "3640",
    "3531", "3523", "3533", "3541", "3564", "3585", "3823", "3442", "3448", "5084",
  ]

universe:
  max_candidates: 300
  primary_allocation_pct: 0.5
  min_revenue_usd_mm: 30
  max_revenue_usd_mm: 800
  min_ebitda_margin: 0.05

llm:
  extraction_model: "gpt-4.1"
  judge_model: "gpt-4.1-mini"
  temperature: 0
  max_tokens: 500
  batch_size: 20
  judge_threshold: 3

output:
  top_n_comps: 15
  report_formats:
    - csv
    - html
