target_company:
  name: "Precision Motion Components Co."
  description: >
    Mid-market manufacturer of precision motion components for automotive
    and industrial OEMs. Products include bearings, drivetrain components,
    machined metal assemblies, and engineered replacement parts sold under
    long-term supply agreements. Asset-heavy operations with North American
    manufacturing facilities.
  revenue_usd_mm: 150
  ebitda_margin_estimate: 0.18
  # Optional analyst estimates for the target's other financial features. Any
  # you provide are used directly in the comp-distance scoring; any you leave
  # unset are imputed from a peer-group median AND excluded from the distance,
  # so an imputed feature can't pull the ranking toward the pool median. Fill
  # in whatever the CIM / management accounts give you for a sharper match.
  # gross_margin_estimate: 0.32
  # revenue_cagr_3yr_estimate: 0.04
  # net_debt_ebitda_estimate: 2.5
  # capex_revenue_estimate: 0.05
  geography: "north_america"
  # Most directly relevant to "automotive OEM parts manufacturer": motor
  # vehicle parts plus general industrial machinery/fabricated metal.
  primary_sic_codes: ["3714", "3569", "3490", "3562"]
  # Broader industrial machinery/equipment SIC codes. 3559 (Special Industry
  # Machinery) moved here from primary — it is too broad to reliably deliver
  # auto-OEM-adjacent comps at the primary allocation; it consistently pulls in
  # semiconductor equipment (ACLS), consumer hardware (CRCT), and energy-tech
  # (ERII) that distort the multiple distribution. 3823 removed entirely —
  # Industrial Instruments captures machine-vision / AI names (e.g. CGNX) whose
  # 50-60x EV/EBITDA multiples are not comparable to asset-heavy OEM suppliers.
  # Explicitly excludes aerospace/defense SIC codes (3760/3721/3724/3812/etc).
  adjacent_sic_codes: [
    "3559",
    "3612", "3613", "3621", "3640",
    "3531", "3523", "3533", "3541", "3564", "3585", "3442", "5084",
  ]

universe:
  max_candidates: 300
  primary_allocation_pct: 0.5
  min_revenue_usd_mm: 30
  max_revenue_usd_mm: 5000
  min_ebitda_margin: 0.05
  # Optional seed tickers. The pipeline resolves each seed's SEC SIC code,
  # adds those SICs to adjacent discovery, and injects the seed itself as an
  # analyst-specified candidate.
  seed_tickers: []
  # Optional analyst overrides. must_include_tickers are injected into the
  # fetched universe even if SIC discovery misses them; exclude_tickers are
  # removed from both SIC-discovered and analyst-specified candidates.
  must_include_tickers: []
  # Optional approval audit only. Approved tickers do not bypass data quality,
  # ranking, tier, or caveat logic; if selected, the report notes that analyst
  # approval is a separate judgment layered on top of the model output.
  analyst_approved_tickers: []
  exclude_tickers: []
  sic_clusters:
    "3714": "auto_parts"
    "3562": "bearings_and_drivetrain_components"
    "3559": "industrial_machinery"
    "3569": "general_industrial_equipment"
    "3490": "fabricated_metal_products"
    "3612": "electrical_equipment"
    "3613": "electrical_equipment"
    "3621": "electrical_equipment"
    "3640": "lighting_equipment"
    "3531": "construction_machinery"
    "3523": "agricultural_machinery"
    "3533": "industrial_machinery"
    "3541": "machine_tools"
    "3564": "industrial_equipment"
    "3585": "industrial_equipment"
    "3442": "metal_building_products"
    "5084": "industrial_distribution"

llm:
  extraction_model: "gpt-4.1"
  judge_model: "gpt-4.1-mini"
  embedding_model: "text-embedding-3-small"
  temperature: 0
  max_tokens: 500
  batch_size: 20
  judge_threshold: 3

output:
  top_n_comps: 15
  report_formats:
    - csv
    - html
  # Shown in the footer for attribution.
  prepared_by: "PE Comps Pipeline Demo"
  confidential: false

valuation:
  # Net haircut applied to the comp-derived implied EV. Public trading comps
  # are large-cap, liquid, minority-interest multiples; applied straight to a
  # ~$150mm-revenue private target they overstate value. 0.25 here reflects a
  # size/illiquidity (marketability) discount net of an assumed control
  # premium — a directional default, tune per deal. Set to 0.0 to disable and
  # show only the raw comp range.
  size_marketability_discount: 0.25
  discount_note: >
    25% illustrative private-company adjustment for size and marketability,
    partially offset by an assumed control premium. This is a demo assumption,
    not investment advice.
  # Capitalize operating-lease liabilities (ASC 842) into enterprise value.
  # Default false keeps EV/EBITDA pre-lease-capitalization, consistent with
  # EBITDA being net of operating-lease cost. Set true for a lease-heavy
  # target if you want the lease-capitalized view (note: the resulting
  # EV/EBITDA is then on a different basis than the unadjusted comps — a true
  # like-for-like would use EV-incl-leases over EBITDAR). Minority interest
  # and preferred equity are always included in the EV bridge regardless.
  include_operating_leases_in_ev: false

scorer:
  # {business_model: {financial_feature: weight}} for the comp-distance
  # calculation, looked up by the TARGET's business_model (every candidate
  # is measured against the same ruler). Features omitted from a template
  # default to 1.0; an unmatched/null business_model falls back to
  # "default". Leave this whole block empty to use plain unweighted
  # Euclidean distance.
  feature_weights:
    manufacturing:
      revenue_ttm_log: 1.5    # tighter size discipline for OEM supply-chain comps
      ebitda_margin: 2.0
      capex_revenue: 1.5      # capital intensity distinguishes OEM suppliers from asset-light peers
      net_debt_ebitda: 1.5
      revenue_cagr_3yr: 0.75
    SaaS:
      revenue_cagr_3yr: 3.0
      gross_margin: 1.5
      ebitda_margin: 0.5
    default:
      revenue_ttm_log: 1.0
      ebitda_margin: 1.0
      gross_margin: 1.0
      revenue_cagr_3yr: 1.0
      net_debt_ebitda: 1.0
      capex_revenue: 1.0

  # Soft penalties added to a candidate's financial-distance score (not
  # exclusions) in the Top-N selection. See src/config_schema.py's
  # RankingPenaltiesConfig for what each one does.
  #
  # Penalties are in residual-distance units (added to the financial-distance
  # score, not an ordinal rank). Ordering reflects comp-selection priorities
  # for an auto-OEM target: a different business model (0.6) and customer base
  # (0.5, e.g. B2C aftermarket vs B2B OEM) remain meaningful mismatches, while
  # a wrong end-market gets a larger penalty because a financially close company
  # in the wrong industry should not lead the comp set.
  ranking_penalties:
    business_model_penalty: 0.6
    customer_type_penalty: 0.5
    # End-market penalty ramps in below the similarity threshold:
    #   penalty = subsector_mismatch_penalty * (threshold - sim) / threshold
    # so 2.0 is the maximum (an entirely unrelated end market at similarity
    # 0); typical drift observed with text-embedding-3-small (sim 0.35-0.45
    # vs threshold 0.48) costs ~0.1-0.55, comparable to a business-model
    # mismatch. No cliff: a 0.02 similarity difference (embedding noise)
    # changes the penalty by ~0.08, not by the full amount. Any nonzero
    # shortfall also blocks the Core tier (see reporter._annotate_top_rows).
    subsector_similarity_threshold: 0.48
    subsector_mismatch_penalty: 2.0
    # Tighter size band: 0.7 log10 (~±5x) free; each further decade of revenue
    # gap adds 1.0 of financial distance, so a ~50x comp is demoted by ~1.0 (a
    # large gap relative to the ~0.3-2.0 residual spread).
    size_penalty_free_log10_range: 0.7
    size_penalty_per_extra_log10: 1.0
